[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajcontacts2"
version = "0.4.0"
description = "Residue-residue contacts from MD trajectories and PDB structures"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Midhun K Madhu", email = "midhunkmadhu14@gmail.com" },
]
maintainers = [
    { name = "Midhun K Madhu", email = "midhunkmadhu14@gmail.com" },
]
keywords = [
    "molecular-dynamics",
    "contact-map",
    "structural-biology",
    "mdtraj",
    "protein",
    "network-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mdtraj>=1.9.7",
    "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "scipy"]

[project.urls]
Homepage = "https://github.com/MidhunkMadhu/trajcontacts2"
Source = "https://github.com/MidhunkMadhu/trajcontacts2"
Issues = "https://github.com/MidhunkMadhu/trajcontacts2/issues"
Group = "https://home.iiserb.ac.in/~rkm/"

[project.scripts]
trajcontacts2 = "trajcontacts2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
